apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-deployment
  labels:
    app: vle8-demo
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vle8-demo
      version: blue
  template:
    metadata:
      labels:
        app: vle8-demo
        version: blue
    spec:
      containers:
        - name: web
          image: Raiz-m/vle8-blue-green:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
